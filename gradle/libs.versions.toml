# Yuno 2.0.0 版本矩阵
#
# 版本矩阵依据：2026-10-18 调研
#  - AGP 9.4.1 → 最佳 Gradle 9.6.0 / JDK 17（AGP 9.4 release notes 兼容表）
#  - Kotlin 2.4.21 与 org.jetbrains.kotlin.plugin.compose 版本严格一致
#  - Compose BOM 2026.09.00（material3 1.4.0）
#  - Haze 2.0.1：全部 artifact 必须同一版本
#
# ⚠️ AGP 9 起 Kotlin 内置：**禁用 org.jetbrains.kotlin.android 插件**，
#    编译设置走顶层 kotlin { compilerOptions {} }。

[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
datastore = "1.2.1"
kotlinxSerializationJson = "1.11.0"
kotlinxCoroutines = "1.10.2"
media3 = "1.11.1"
coil = "3.6.3"
haze = "2.0.1"
palette = "1.0.0"
okhttp = "4.12.0"
coreKtx = "1.13.1"
junit = "4.13.2"
ksoup = "0.2.6"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
haze-blur = { group = "dev.chrisbanes.haze", name = "haze-blur", version.ref = "haze" }
haze-glass = { group = "dev.chrisbanes.haze", name = "haze-glass", version.ref = "haze" }

androidx-palette-ktx = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# 歌词特效（Folia 照搬路线 B 的降级路径）：
# Ksoup = Kotlin 纯 HTML 解析器（零依赖），fx_glow.html 的 DOM 用它在 Kotlin 侧解析，
# 配自写 CSS 解析器读 text-shadow 参数，再映射到 Compose 布局。
ksoup = { group = "com.fleeksoft.ksoup", name = "ksoup-jvm", version.ref = "ksoup" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
